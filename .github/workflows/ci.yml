name: CI

# Pushes to main are covered by deploy.yml, which runs the same checks before deploying —
# this workflow only guards pull requests, so main doesn't run everything twice.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # check:references also runs in .husky/pre-commit, but --no-verify bypasses that,
        # and clinical data drifting out of step with references/ is the one thing no
        # reviewer is watching for here.
        command: [lint, typecheck, test, "check:references"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run ${{ matrix.command }}

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run build

<section class="card">
  <div class="card-body">
    @for (finding of findings(); track finding.id; let last = $last) {
      <div
        class="flex items-center justify-between gap-4 py-2"
        [class]="last ? '' : 'border-b border-line'"
      >
        <label class="text-sm text-body" [attr.for]="'finding-' + finding.id">
          {{ finding.label }}
        </label>
        @if (finding.kind === 'boolean') {
          <input
            [id]="'finding-' + finding.id"
            type="checkbox"
            class="size-4 shrink-0"
            [checked]="values()[finding.id] === true"
            (change)="setBoolean(finding.id, $any($event.target).checked)"
          />
        } @else {
          <span class="flex items-center gap-1.5 text-sm text-muted shrink-0">
            <input
              [id]="'finding-' + finding.id"
              type="number"
              class="input w-24"
              [value]="numberValueFor(finding.id) ?? ''"
              (input)="setNumber(finding.id, $any($event.target).value)"
            />
            @if (finding.unit) {
              {{ finding.unit }}
            }
          </span>
        }
      </div>
    } @empty {
      <p class="py-4 text-center text-sm text-muted">這張表還沒有任何項目。</p>
    }
  </div>
</section>

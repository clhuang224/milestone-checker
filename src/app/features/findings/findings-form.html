<section class="bg-white rounded-lg border border-slate-200 p-4">
  <div class="space-y-2">
    @for (finding of findings(); track finding.id) {
      <div class="flex items-center justify-between gap-3">
        <label class="text-sm text-slate-700" [attr.for]="'finding-' + finding.id">
          {{ finding.label }}
        </label>
        @if (finding.kind === 'boolean') {
          <input
            [id]="'finding-' + finding.id"
            type="checkbox"
            class="h-4 w-4"
            [checked]="values()[finding.id] === true"
            (change)="setBoolean(finding.id, $any($event.target).checked)"
          />
        } @else {
          <span class="flex items-center gap-1 text-sm text-slate-600">
            <input
              [id]="'finding-' + finding.id"
              type="number"
              class="w-24 border border-slate-300 rounded px-2 py-1"
              [value]="numberValueFor(finding.id) ?? ''"
              (input)="setNumber(finding.id, $any($event.target).value)"
            />
            @if (finding.unit) {
              {{ finding.unit }}
            }
          </span>
        }
      </div>
    } @empty {
      <p class="text-sm text-slate-500">這張表還沒有任何項目。</p>
    }
  </div>
</section>

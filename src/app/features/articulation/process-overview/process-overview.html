<section class="bg-white rounded-lg border border-slate-200 p-4">
  <h3 class="font-medium text-slate-800 mb-1">音韻歷程總覽</h3>
  <p class="text-xs text-slate-500 mb-3">
    依治療師貼的標籤歸納,僅供臨床參考——系統不會自動判斷音對屬於哪個歷程。
  </p>

  <div class="space-y-3">
    @for (group of groups(); track group.id) {
      <div class="border border-slate-200 rounded p-3">
        <div class="flex items-baseline justify-between gap-3">
          <h4 class="text-sm font-medium text-slate-800">{{ group.name }}</h4>
          <span class="text-xs text-slate-500">{{ group.pairs.length }} 筆</span>
        </div>
        @if (group.description) {
          <p class="text-xs text-slate-500 mt-0.5">{{ group.description }}</p>
        }
        <div class="flex flex-wrap gap-1.5 mt-2">
          @for (pair of group.pairs; track $index) {
            <span class="text-sm bg-slate-100 text-slate-700 rounded px-2 py-0.5">{{ pair }}</span>
          }
        </div>
      </div>
    } @empty {
      <p class="text-sm text-slate-500">目前還沒有記錄到錯誤音對。</p>
    }
  </div>
</section>

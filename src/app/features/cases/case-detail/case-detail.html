@if (caseRecord(); as c) {
  <div class="space-y-5">
    <div>
      <a routerLink="/cases" class="text-sm text-sky-700 hover:underline">← 回個案清單</a>
      <div class="flex items-baseline justify-between gap-3 mt-1">
        <h2 class="text-lg font-semibold text-slate-800">{{ c.label }}</h2>
        <a
          [routerLink]="['/cases', c.id, 'articulation']"
          class="text-sm text-sky-700 hover:underline"
        >
          構音記錄 →
        </a>
      </div>
      <div class="flex items-center gap-2 mt-2">
        <label class="text-sm text-slate-600" for="case-birth-date">生日</label>
        <input
          id="case-birth-date"
          type="date"
          class="border border-slate-300 rounded px-2 py-1 text-sm"
          [value]="c.birthDateISO ?? ''"
          (change)="onBirthDateChange($any($event.target).value)"
        />
        @if (ageLabel(); as age) {
          <span class="text-sm text-slate-500">{{ age }}</span>
        } @else {
          <span class="text-xs text-slate-400">沒填生日的話，用到年齡的規則不會判斷</span>
        }
      </div>
    </div>

    <app-findings-form
      [findings]="findings()"
      [values]="values()"
      (valuesChange)="onValuesChange($event)"
    />

    <app-warnings-list [triggeredRules]="triggeredRules()" />

    <app-report-draft [generatedText]="reportText()" />
  </div>
} @else {
  <p class="text-sm text-slate-500">找不到這個個案。</p>
  <a routerLink="/cases" class="text-sm text-sky-700 hover:underline">← 回個案清單</a>
}

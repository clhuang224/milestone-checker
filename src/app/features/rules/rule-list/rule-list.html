<div class="space-y-5">
  <div class="flex items-start justify-between gap-4">
    <h1 class="page-title">規則</h1>
    <!-- 新增規則 stays the first <button> in the DOM; a component test clicks it that way. -->
    <div class="flex gap-2 shrink-0">
      <button type="button" class="btn btn-primary" (click)="startCreate()">新增規則</button>
      <button type="button" class="btn btn-quiet" (click)="exportRules()">匯出</button>
      <label class="btn btn-quiet cursor-pointer">
        匯入
        <input
          type="file"
          accept="application/json"
          class="hidden"
          (change)="importRules($event)"
        />
      </label>
    </div>
  </div>

  @if (importError()) {
    <p class="sev sev-critical text-sm">{{ importError() }}</p>
  }

  @if (isEditorOpen()) {
    <app-rule-editor
      [initialRule]="editingRule()"
      [fields]="fields()"
      [processes]="processes()"
      (saveRule)="onSave($event)"
      (cancelEdit)="closeEditor()"
    />
  }

  <section class="card">
    @for (rule of rules(); track rule.id; let last = $last) {
      <div class="px-4 py-3" [class]="last ? '' : 'border-b border-line'">
        <div class="flex items-baseline justify-between gap-4">
          <span class="flex items-baseline gap-2 min-w-0">
            <span
              class="text-base font-medium"
              [class]="rule.enabled ? 'text-ink' : 'text-muted'"
              >{{ rule.name }}</span
            >
            @if (!rule.enabled) {
              <span class="meta shrink-0">（已停用）</span>
            }
          </span>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" class="btn btn-sm btn-ghost" (click)="toggleEnabled(rule)">
              {{ rule.enabled ? '停用' : '啟用' }}
            </button>
            <button type="button" class="btn btn-sm btn-ghost" (click)="startEdit(rule)">
              編輯
            </button>
            <button type="button" class="btn btn-sm btn-danger" (click)="removeRule(rule.id)">
              刪除
            </button>
          </div>
        </div>
        <p class="text-sm text-body mt-1 leading-6">{{ rule.action.message }}</p>
      </div>
    } @empty {
      <p class="px-4 py-6 text-center text-sm text-muted">
        還沒有任何規則，點右上角「新增規則」開始。
      </p>
    }
  </section>
</div>

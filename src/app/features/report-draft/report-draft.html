<section class="card">
  <div class="card-head">
    <h2 class="card-title">報告草稿</h2>
    <div class="flex gap-1.5">
      <button type="button" class="btn btn-sm btn-quiet" (click)="regenerate()">重新產生</button>
      <button type="button" class="btn btn-sm btn-quiet" (click)="copy()">複製</button>
    </div>
  </div>

  <div class="card-body space-y-2">
    @if (hasEdits()) {
      <p class="sev sev-warning text-xs">
        <span aria-hidden="true" class="mr-1">⚠</span>這份草稿已經手動改過，重新產生會蓋掉。
      </p>
    }
    <textarea
      rows="10"
      aria-label="報告草稿"
      placeholder="目前沒有觸發任何附報告範本的規則。"
      class="textarea"
      [value]="draftText()"
      (input)="setText($any($event.target).value)"
    ></textarea>
  </div>
</section>

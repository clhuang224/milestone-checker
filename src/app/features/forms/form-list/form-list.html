<div class="space-y-5">
  <div>
    <h1 class="page-title">評估表一覽</h1>
    <p class="meta mt-1">設定每張表要填什麼、以及什麼情況要示警。</p>
  </div>

  <section class="card">
    <!-- Rules that read case age or span several forms belong to no single form, so they get
         their own row rather than being filed under one arbitrarily. -->
    <a
      routerLink="/rules"
      class="group flex items-center justify-between gap-4 px-4 py-3 border-b border-line hover:bg-sunk"
    >
      <span>
        <span class="text-base font-medium text-ink group-hover:text-accent-strong">跨表規則</span>
        <span class="block meta mt-0.5">用到年齡、或同時讀好幾張表的規則</span>
      </span>
      <span class="text-sm text-muted shrink-0">
        {{ ruleCount() }} 條
        <span aria-hidden="true" class="ml-1 text-faint group-hover:text-accent">→</span>
      </span>
    </a>

    @for (row of rows(); track row.id; let last = $last) {
      <div
        class="flex items-center justify-between gap-4 px-4 py-3"
        [class]="last ? '' : 'border-b border-line'"
      >
        <span>
          <span class="text-base font-medium text-ink">{{ row.name }}</span>
          @if (!row.editable) {
            <span class="block meta mt-0.5">
              專用表格，輸入方式由程式提供;可設定它使用的分類目錄
            </span>
          }
        </span>
        <span class="flex items-center gap-4 shrink-0 text-sm">
          <span class="text-muted">{{ row.usedBy }} 筆使用中</span>
          @if (row.id === 'articulation') {
            <a routerLink="/articulation-processes" class="link">音韻歷程 →</a>
          }
        </span>
      </div>
    } @empty {
      <p class="px-4 py-6 text-center text-sm text-muted">還沒有任何評估表。</p>
    }
  </section>
</div>
